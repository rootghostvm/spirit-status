# Optional backup keep-alive. Hetrix (or similar) every ~1m is preferred.
# curl exit 23 was caused by piping to `head` (SIGPIPE) — do not pipe the body.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping status API
        env:
          STATUS_URL: ${{ vars.STATUS_KEEPALIVE_URL || 'https://status.spirithost.co.uk/api/status' }}
        run: |
          set -euo pipefail
          echo "Pinging $STATUS_URL"
          code=$(curl -sS --max-time 45 \
            -A "SpiritStatus-KeepAlive/1.0" \
            -o /dev/null \
            -w "%{http_code}" \
            "$STATUS_URL")
          echo "HTTP $code"
          test "$code" = "200"
