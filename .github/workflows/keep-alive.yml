# Keeps the Render free instance awake so status probes keep running.
# Free web services sleep after ~15m without traffic; this pings before that.
name: Keep alive

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping status API
        env:
          STATUS_URL: ${{ vars.STATUS_KEEPALIVE_URL || 'https://status.spirithost.co.uk/api/status' }}
        run: |
          set -euo pipefail
          echo "Pinging $STATUS_URL"
          curl -fsS --max-time 45 -A "SpiritStatus-KeepAlive/1.0" "$STATUS_URL" \
            | head -c 200
          echo
          echo "OK"
